<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Inkling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a three-pane writing desk. Binder (manuscript + story bible) on the left,
   the page in the middle, the Inkling pet and goals on the right. Under 1080px the panes
   become tabs. Ink-blue is the one UI accent; character / place / thing colours are semantic. */
:root{
  --bg:#E7EBF1; --panel:#F4F6F9; --panel2:#EBEFF5; --paper:#FDFEFF;
  --ink:#17202D; --muted:#5A6678; --line:#D2DAE5;
  --accent:#2A4ED8; --accent-ink:#FFFFFF; --accent-soft:#E1E7FA;
  --pet:#17A08A; --pet-deep:#0E7565; --pet-ink:#0A2A26;
  --char:#B3306C; --place:#1B8A5A; --thing:#A86E0C;
  --ok:#1B8A5A; --danger:#C0392B;
  --shadow:0 1px 2px rgba(23,32,45,.08),0 8px 24px rgba(23,32,45,.08);
  --tabh:0px; --fs:18px;
  --f-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-prose:'Literata',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121A; --panel:#141A25; --panel2:#1A2230; --paper:#18202C;
    --ink:#E6EBF3; --muted:#98A4B6; --line:#2A3446;
    --accent:#8FA5FF; --accent-ink:#0D121A; --accent-soft:#222C4E;
    --pet:#3CCDB3; --pet-deep:#1F9482; --pet-ink:#06201C;
    --char:#F083B3; --place:#5FD39B; --thing:#E8B34F;
    --ok:#5FD39B; --danger:#FF8A7A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121A; --panel:#141A25; --panel2:#1A2230; --paper:#18202C;
  --ink:#E6EBF3; --muted:#98A4B6; --line:#2A3446;
  --accent:#8FA5FF; --accent-ink:#0D121A; --accent-soft:#222C4E;
  --pet:#3CCDB3; --pet-deep:#1F9482; --pet-ink:#06201C;
  --char:#F083B3; --place:#5FD39B; --thing:#E8B34F;
  --ok:#5FD39B; --danger:#FF8A7A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{flex:none}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{position:relative;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-prose);font-style:italic;font-weight:650;font-size:20px;letter-spacing:-.01em;color:var(--accent);flex:none}
.proj{flex:1 1 140px;min-width:0;max-width:420px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;font-weight:600;font-size:15px;text-overflow:ellipsis}
.proj:hover{border-color:var(--line)} .proj:focus{border-color:var(--accent);background:var(--paper);outline:none}
.grow{flex:1}
.save{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save[data-s="saving"] i{background:var(--thing)} .save[data-s="error"] i{background:var(--danger)} .save[data-s="local"] i{background:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.ring{display:block}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line)} .ring .arc{stroke:var(--pet);stroke-linecap:round;transition:stroke-dasharray .4s}
.ibtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);padding:0}
.ibtn:hover{background:var(--panel2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--danger)}
.menu{position:absolute;right:12px;top:calc(100% + 6px);width:min(300px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.menu button{text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-size:13px}
.menu button:hover{background:var(--panel2)}
.menu button.warn{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.menu small{color:var(--muted);padding:4px 10px 6px;font-size:12px}

.cols{display:grid;grid-template-columns:272px minmax(0,1fr) 308px;grid-template-rows:minmax(0,1fr);min-height:0}
.pane{overflow:auto;min-height:0;min-width:0}
.pane-binder{background:var(--panel);border-right:1px solid var(--line);overflow-x:hidden}
.pane-insp{background:var(--panel);border-left:1px solid var(--line)}
.pane-main{background:var(--bg);position:relative}
#app.focus .pane-binder,#app.focus .pane-insp{display:none}
#app.focus .cols{grid-template-columns:minmax(0,1fr)}
.tabs{display:none}

/* binder */
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 8px 16px;position:sticky;top:0;background:var(--panel);z-index:2}
.pane-head h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pane-head .row{display:flex;gap:6px}
.tree{padding:0 8px 24px}
.ch-row,.sc-row,.e-row,.bsec{display:flex;align-items:center;gap:2px;border-radius:8px;min-width:0}
.ch-row{margin-top:8px}
.ch-row:hover,.sc-row:hover,.e-row:hover{background:var(--panel2)}
.tw{border:0;background:transparent;color:var(--muted);width:24px;height:28px;display:grid;place-items:center;padding:0;flex:none}
.ch-title{flex:1;min-width:0;border:0;background:transparent;text-align:left;font-weight:600;padding:5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 6px;flex:none;font-variant-numeric:tabular-nums}
.acts{display:flex;opacity:0;flex:none}
.ch-row:hover .acts,.sc-row:hover .acts,.e-row:hover .acts,.acts:focus-within,.acts.on{opacity:1}
@media (hover:none){.acts{opacity:1}}
.acts .ibtn{width:24px;height:24px}
.acts .ibtn.on{color:var(--danger);width:auto;padding:0 6px;font-size:11px;font-weight:600}
.sc-row{margin-left:20px}
.sc-row.on,.e-row.on{background:var(--accent-soft)}
.sc-btn,.e-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:6px 6px;border-radius:8px}
.sc-btn .t,.e-btn .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:2px solid var(--muted)}
.dot.st-draft{border-color:var(--muted)} .dot.st-revised{border-color:var(--accent);background:var(--accent)} .dot.st-final{border-color:var(--ok);background:var(--ok)}
.rn{flex:1;min-width:0;border:1px solid var(--accent);border-radius:6px;padding:4px 6px;background:var(--paper)}
.bsec{margin-top:16px;padding-left:4px}
.bsec .lbl{flex:1;display:flex;align-items:center;gap:4px;border:0;background:transparent;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px}
.bsec .n{font-family:var(--f-mono);font-weight:400}
.e-row{margin-left:8px}
.pip{width:9px;height:9px;border-radius:3px;background:currentColor;flex:none}
.empty-s{color:var(--muted);font-size:12px;padding:2px 14px 6px 36px}
.bsec .ibtn{width:26px;height:26px}
.bsec [data-a="relabel"]{opacity:0}
.bsec:hover [data-a="relabel"],.bsec [data-a="relabel"]:focus-visible{opacity:1}
@media (hover:none){.bsec [data-a="relabel"]{opacity:1}}
.relabel{margin:4px 4px 10px 8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);display:grid;gap:8px}
.relabel label.f input{padding:5px 8px;background:var(--bg)}
.relabel .row{display:flex;gap:6px;flex-wrap:wrap}

/* main */
.main-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.mh-title{margin:0;font-size:18px;font-weight:650;flex:1 1 160px;min-width:0}
.title-in{flex:1 1 200px;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-size:18px;font-weight:650;font-family:var(--f-prose)}
.title-in:hover{border-color:var(--line)} .title-in:focus{border-color:var(--accent);background:var(--paper);outline:none}
select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 8px;font-size:13px;max-width:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mk-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:10;min-width:210px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:4px}
.pop .pt{font-size:12px;color:var(--muted);padding:2px 6px 6px;overflow-wrap:anywhere}
.pop button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:8px;padding:8px;text-align:left}
.pop button:hover{background:var(--panel2)}
.sheet{max-width:780px;margin:24px auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:52px 64px;min-width:0}
.pane-main > .sheet{width:calc(100% - 32px)}
.editor{min-height:52vh;font-family:var(--f-prose);font-size:var(--fs);line-height:1.8;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;outline:none;caret-color:var(--accent);font-variation-settings:'opsz' 18}
.editor:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.ent{cursor:pointer;border-bottom:2px solid currentColor;border-radius:2px;background:color-mix(in srgb,currentColor 11%,transparent);padding:0 1px}
.ent:hover{background:color-mix(in srgb,currentColor 22%,transparent)}
.t-char{color:var(--char)} .t-place{color:var(--place)} .t-thing{color:var(--thing)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 6px color-mix(in srgb,currentColor 35%,transparent)}100%{box-shadow:0 0 0 6px transparent}}
.hint{max-width:780px;margin:-8px auto 28px;padding:0 16px;color:var(--muted);font-size:12px;text-align:center}
.banner{max-width:780px;margin:16px auto 0;width:calc(100% - 32px);display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px}
.banner span{min-width:0}

/* entity page */
.ent-page .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ent-name{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-family:var(--f-prose);font-size:34px;font-weight:650;letter-spacing:-.01em;padding:4px 0 8px;margin:8px 0 14px;border-radius:0}
.ent-name:focus{outline:none;border-bottom-color:var(--accent)}
.meta-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}
label.f input,label.f textarea,.ta{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--ink);font-size:14px;min-width:0;width:100%}
label.f textarea{resize:vertical;font-family:var(--f-prose);font-size:15.5px;line-height:1.65;min-height:76px;overflow:hidden}
label.f input:focus,label.f textarea:focus,.ta:focus{border-color:var(--accent);outline:none}
.fields{display:grid;gap:16px}
.appears{margin-top:32px;border-top:1px solid var(--line);padding-top:16px}
.appears h3{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.appears p.sub{margin:0 0 10px;color:var(--muted);font-size:13px}
.ap{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ap:hover{border-color:var(--accent)}
.ap b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ap span.sn{display:block;color:var(--muted);font-family:var(--f-prose);font-size:13.5px;margin-top:4px;overflow-wrap:anywhere}
.ap mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}

/* corkboard */
.cork{padding:8px 16px 40px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px;min-height:100%}
.cork-ch{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.ch-notes{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);margin:0 0 18px;max-width:900px}
.chn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 6px 6px}
.ch-notes:not(.shut) .chn-head{border-bottom:1px solid var(--line)}
.chn-tog{display:flex;align-items:center;gap:6px;border:0;background:transparent;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:4px 6px;border-radius:6px}
.chn-tog:hover{color:var(--ink)}
.chn-head .mono{font-size:11px}
.chn-ta{display:block;width:100%;border:0;background:transparent;resize:none;padding:12px 16px;font-family:var(--f-prose);font-size:15px;line-height:1.65;min-height:110px;overflow:hidden}
.chn-ta:focus{outline:none;background:color-mix(in srgb,var(--accent) 4%,transparent)}
#chNames{padding:0 16px 12px}
#chNames:empty{display:none}
.chn-peek{display:flex;align-items:flex-start;gap:8px;width:100%;max-width:900px;margin:-4px 0 12px;border:1px dashed var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent);border-radius:8px;padding:8px 12px;text-align:left;color:var(--muted);font-family:var(--f-prose);font-size:13.5px;line-height:1.5}
.chn-peek:hover{border-color:var(--accent);color:var(--ink)}
.chn-peek .ico{margin-top:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.card header{display:flex;align-items:flex-start;gap:8px;justify-content:space-between;padding:10px 12px 6px;border-bottom:2px solid var(--accent-soft)}
.card-t{border:0;background:transparent;padding:0;text-align:left;font-weight:650;font-family:var(--f-prose);font-size:15px;min-width:0;overflow-wrap:anywhere}
.card-t:hover{color:var(--accent)}
.st{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;background:var(--panel2);color:var(--muted)}
.st-revised{background:var(--accent-soft);color:var(--accent)} .st-final{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.syn{border:0;background:transparent;resize:none;padding:8px 12px;font-family:var(--f-prose);font-size:14px;line-height:1.55;min-height:96px;width:100%}
.syn:focus{outline:none;background:var(--bg)}
.card footer{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 6px 12px;color:var(--muted);font-size:12px}

/* inspector */
.psec{padding:14px 16px;border-bottom:1px solid var(--line)}
.psec h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pet-card{padding:16px;border-bottom:1px solid var(--line)}
.pet-stage{display:grid;place-items:center;background:var(--panel2);border-radius:16px;padding:14px 0 6px}
.pet-btn{border:0;background:transparent;padding:0;border-radius:16px}
.pet-btn svg{width:150px;height:150px;display:block;overflow:visible}
.bubble{position:relative;margin:14px 4px 0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.bubble::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;background:var(--paper);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pet-meta{display:flex;align-items:center;gap:8px;margin-top:12px}
.pet-name{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;background:transparent;font-weight:650;font-size:16px;padding:3px 6px}
.pet-name:hover{border-color:var(--line)} .pet-name:focus{border-color:var(--accent);outline:none;background:var(--paper)}
.stage-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--pet) 18%,transparent);color:var(--pet-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage-tag{color:var(--pet)}}
:root[data-theme="dark"] .stage-tag{color:var(--pet)}
.evo{margin-top:10px}
.evo small{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--pet);border-radius:99px;transition:width .4s}
.bar.lg{height:12px}
.bar.proj i{background:var(--accent)}
.big{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.big b{font-size:34px;font-weight:500;line-height:1}
.big span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip2{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--panel2);color:var(--muted)}
.chip2.hot{background:color-mix(in srgb,var(--thing) 20%,transparent);color:var(--thing)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two label.f input{background:var(--paper)}
.fine{margin:8px 0 0;font-size:12px;color:var(--muted)}
.ta{display:block;font-family:var(--f-prose);font-size:14.5px;line-height:1.6;resize:vertical;min-height:84px;background:var(--paper)}
.sec-l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.chiplinks{display:flex;flex-wrap:wrap;gap:6px}
.cl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px}
.cl:hover{border-color:currentColor}
.cl .pip{width:8px;height:8px}
.cl span.nm{color:var(--ink)}

/* pet art */
.petsvg .shadow{fill:var(--ink);opacity:.13}
.petsvg .pbody{fill:var(--pet)} .petsvg .pdeep{fill:var(--pet-deep)}
.petsvg .shine{fill:none;stroke:#fff;stroke-opacity:.4;stroke-width:5;stroke-linecap:round}
.petsvg .eye{fill:var(--pet-ink)} .petsvg .hl{fill:#fff}

/* ---------- linking names ---------- */
function makeRe(names){
  const a=[...new Set(names.map(n=>(n||'').trim()).filter(n=>n.length>=2))].sort((x,y)=>y.length-x.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!a.length) return null;
  const body='(?:'+a.join('|')+')';
  try{ return new RegExp('(?<![\\p{L}\\p{N}_])'+body+'(?![\\p{L}\\p{N}_])','gu'); }
  catch(e){ return new RegExp('\\b'+body+'\\b','g'); }
}
function buildLinker(){
  const map=new Map();
  Object.values(S.meta.ents).forEach(e=>{[e.name].concat(e.aliases||[]).forEach(n=>{n=(n||'').trim(); if(n.length>=2&&!map.has(n)) map.set(n,e.id);});});
  const re=makeRe([...map.keys()]);
  return re?{re,map}:null;
}
function findLinks(text){
  if(!linker) return [];
  const out=[]; const re=linker.re; re.lastIndex=0; let m;
  while((m=re.exec(text))){ const id=linker.map.get(m[0]); if(id) out.push({s:m.index,e:m.index+m[0].length,id}); if(m[0].length===0) re.lastIndex++; }
  return out;
}
function renderText(text){
  let h='',i=0;
  findLinks(text).forEach(l=>{
    const e=S.meta.ents[l.id]; if(!e) return;
    h+=esc(text.slice(i,l.s))+'<span class="ent t-'+e.type+'" data-ent="'+l.id+'" title="'+esc(e.name+' · '+LS(e.type)+' page')+'">'+esc(text.slice(l.s,l.e))+'</span>';
    i=l.e;
  });
  return h+esc(text.slice(i));
}

/* ---------- editor text + caret ---------- */
function getText(el){
  let out='';
  (function walk(n){
    n.childNodes.forEach(c=>{
      if(c.nodeType===3) out+=c.nodeValue;
      else if(c.nodeName==='BR') out+='\n';
      else if(c.nodeType===1){ if(/^(DIV|P)$/.test(c.nodeName)&&out&&!out.endsWith('\n')) out+='\n'; walk(c); }
    });
  })(el);
  return out;
}
function domSig(el){
  let acc=0; const sig=[];
  el.childNodes.forEach(c=>{
    const t=c.textContent||'';
    if(c.nodeType===1&&c.classList&&c.classList.contains('ent')) sig.push(acc+':'+t.length+':'+c.dataset.ent);
    acc+=t.length;
  });
  return sig.join('|');
}
function caretOffset(el){
  const sel=getSelection();
  if(!sel.rangeCount||!el.contains(sel.anchorNode)) return null;
  const r=sel.getRangeAt(0), pre=document.createRange();
  pre.selectNodeContents(el); pre.setEnd(r.endContainer,r.endOffset);
  return pre.toString().length;
}
function setCaret(el,off){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); let n,acc=0;
  const r=document.createRange(); const sel=getSelection();
  while((n=w.nextNode())){
    const l=n.nodeValue.length;
    if(acc+l>=off){ r.setStart(n,off-acc); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); return; }
    acc+=l;
  }
  r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r);
}
function relinkEditor(force){
  const ed=$('#ed'); if(!ed) return;
  const text=getText(ed);
  const want=findLinks(text).map(l=>l.s+':'+(l.e-l.s)+':'+l.id).join('|');
  if(!force&&want===domSig(ed)){ updateSceneChips(); return; }
  const focused=document.activeElement===ed, off=focused?caretOffset(ed):null;
  ed.innerHTML=renderText(text);
  if(focused&&off!=null) setCaret(ed,off);
  updateSceneChips();
}

/* ---------- persistence ---------- */
function setStatus(k){
  const el=$('#saveSt'); if(!el) return; el.dataset.s=k;
  el.lastChild.textContent={saving:'Saving…',saved:'Saved to your account',local:'Saved on this device',disk:'Saved on this computer',error:'Could not save, retrying'}[k]||'Saved';
}
function dirty(){
  ui.touched=true;
  for(const k of arguments){ P.dirty.add(k); P.gone.delete(k); }
  if(P.dirty.has('meta')) S.meta.saved=Date.now();
  schedule(1400);
}
function schedule(ms){ clearTimeout(P.timer); P.timer=setTimeout(flush,ms); }
function docData(k){
  if(k==='meta') return S.meta;
  const pre=k.slice(0,2); if(k[2]==='_'&&DOCS.includes(pre)) return S[pre][k.slice(3)]||null;
  return null;
}
function mirrorLocal(){
  if(DESK) return;
  try{ const s=JSON.stringify(snapshot()); if(s.length<4500000) localStorage.setItem('inkling:project',s); }catch(e){}
}
async function flush(){
  if(P.busy){ P.again=true; return; }
  P.busy=true; const keys=[...P.dirty]; P.dirty.clear();
  setStatus('saving'); mirrorLocal();
  try{
    if(DESK){
      if(PJ.id) await DESK.save(PJ.id,JSON.stringify(snapshot()),deskInfo());
      P.gone.clear(); P.fails=0; setStatus('disk');
    } else if(P.db){
      const col=P.db.collection(P.base);
      for(const k of keys){ const d=docData(k); if(d==null) continue; await col.doc(k).set(d); P.keys.add(k); }
      const del=[...P.gone]; P.gone.clear();
      for(const k of del){ await col.doc(k).delete(); P.keys.delete(k); }
      P.fails=0; setStatus('saved');
    } else setStatus('local');
  }catch(e){
    keys.forEach(k=>P.dirty.add(k)); P.fails++; setStatus('error');
    if(DESK&&P.fails===1) toast('Could not save to this computer: '+((e&&e.message)||'unknown error')+'. Retrying.',{plain:true});
    if(P.fails<=4) schedule(4000*P.fails);
  }finally{
    P.busy=false;
    if(P.again){ P.again=false; schedule(200); }
  }
}
function allKeys(st){ return new Set(['meta'].concat(...DOCS.map(p=>Object.keys(st[p]||{}).map(k=>p+'_'+k)))); }
function markAllDirty(){
  const nk=allKeys(S);
  P.keys.forEach(k=>{ if(!nk.has(k)) P.gone.add(k); });
  nk.forEach(k=>{ P.dirty.add(k); P.gone.delete(k); });
  schedule(600);
}
async function connectDb(local){
  try{
    const cl=window.claude; if(!cl||!cl.use) return;
    const dbs=await Promise.all([cl.use('db'),cl.use('user')]);
    const db=dbs[0], user=dbs[1]; if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    P.db=db; P.base='data/users/'+id;
    const snap=await db.collection(P.base).get();
    const docs={}; snap.docs.forEach(d=>{docs[d.id]=d.data(); P.keys.add(d.id);});
    if(docs.meta){
      const o={meta:docs.meta}; DOCS.forEach(p=>{ o[p]={}; });
      Object.keys(docs).forEach(k=>{ const pre=k.slice(0,2); if(k[2]==='_'&&DOCS.includes(pre)) o[pre][k.slice(3)]=docs[k]; });
      const remote=normalize(o);

        if(!viewValid(ui.view)) ui.view=firstView();
        ui.hist=ui.hist.filter(viewValid); renderAll();

}

  if(!m.mark||m.mark.d!==k) m.mark={d:k,hit:{},over:0};
  const hit=m.mark.hit, name=m.pet.name; let msg=null,big=false,top=null;
  [['q25',.25],['q50',.5],['q75',.75],['goal',1]].forEach(a=>{ if(after>=g*a[1]&&!hit[a[0]]){ hit[a[0]]=1; top=a[0]; } });
  if(sa>sb){ msg=name+' grew into a '+STAGES[sa].n+'! '+fmt(m.pet.total)+' words so far.'; big=true; }
  else if(top==='goal'){ const s=streak(); msg=pick(['Daily goal reached! '+name+' is going wild.','You did it: '+fmt(g)+' words today!'])+(s>1?' '+s+'-day streak.':''); big=true; }
  else if(top==='q75') msg=pick(['Three quarters of today\'s goal. The finish line is in sight!','75%! One more push.']);
  else if(top==='q50') msg=pick(['Halfway to today\'s goal!','50%! '+name+' is doing a little dance.']);
  else if(top==='q25') msg=pick(['A quarter of today\'s goal. Keep it flowing!','25%! The quill is warming up.']);
  else if(after>=g){ const over=Math.floor((after-g)/250); if(over>m.mark.over){ m.mark.over=over; msg=pick(['Bonus words! '+fmt(after-g)+' past the goal.',name+' cannot stop cheering.']); } }
  else if(!hit.start&&after>=20){ hit.start=1; msg=pick(['First words of the day. '+name+' is awake!','The page is no longer blank. Nice start.']); }
  if(msg) cheer(msg,big);
}

  else { if(i<c.scenes.length-1){ c.scenes.splice(i,1); c.scenes.splice(i+1,0,id); } else if(ci<cs.length-1){ c.scenes.splice(i,1); cs[ci+1].scenes.unshift(id); cs[ci+1].open=true; } else return; }

    else if(a==='ren'){ ui.rename=id; renderBinder(); }
    else if(a==='chup') moveChapter(id,-1);
    else if(a==='chdn') moveChapter(id,1);
    else if(a==='scup') moveScene(id,-1);
    else if(a==='scdn') moveScene(id,1);
    else if(a==='delch') confirmDo('ch'+id,()=>delChapter(id),rr);
    else if(a==='delsc') confirmDo('sc'+id,()=>delScene(id),rr);
    else if(a==='dele') confirmDo('en'+id,()=>delEntity(id),rr);
    else if(a==='sec'){ ui.openSec[b.dataset.t]=!ui.openSec[b.dataset.t]; renderBinder(); }
    else if(a==='adde'){ const t=b.dataset.t; ui.openSec[t]=true; const nid=addEntity(t,'New '+LS(t).toLowerCase()); ui.focusName=true; go({k:'ent',id:nid}); }
    else if(a==='open-e') go({k:'ent',id});
    else if(a==='open-tl') go({k:'tl',id});
    else if(a==='open-ol') go({k:'ol',id});
    else if(a==='open-nt') go({k:'nt',id});
    else if(a==='addol') addDocItem('ol');
    else if(a==='addnt'){ ui.ntAdd=!ui.ntAdd; ui.openSec.nt=true; renderBinder(); }
    else if(a==='addnt-page'||a==='addnt-board'){ ui.ntAdd=false; addDocItem('nt',a==='addnt-board'?'board':'page'); }
    else if(a==='bcfg'){ ui.binderCfg=!ui.binderCfg; renderBinder(); }
    else if(a==='open-rm'||a==='open-ft') go({k:a.slice(5),id});
    else if(a==='addrm'||a==='addft') addDocItem(a.slice(3));
    else if(a==='delol'||a==='delnt'||a==='delrm'||a==='delft'){ const k=a.slice(3); confirmDo(k+id,()=>delDocItem(k,id),rr); }
    else if(a==='relabel'){ ui.relabel=ui.relabel===b.dataset.t?null:b.dataset.t; renderBinder(); const i=$('#rlP'); if(i){ i.focus(); i.select(); } }
    else if(a==='rl-save') saveRelabel(true);
    else if(a==='rl-reset'){ delete S.meta.labels[ui.relabel]; dirty('meta'); ui.relabel=null; renderAll(); }
    else if(a==='addtl') addTimeline();
    else if(a==='deltl') confirmDo('tl'+id,()=>delTimeline(id),rr);
  });
}

/* ---------- main: scene ---------- */
function renderMain(){
  const v=ui.view, el=$('#main');
  if(!viewValid(v)){ ui.view=firstView(); return renderMain(); }
  const key=v.k+':'+(v.id||''), reset=key!==ui.lastKey; ui.lastKey=key;
  const keep=el.scrollTop;
  if(v.k==='ent') renderEnt(el,v); else if(v.k==='cork') renderCork(el); else if(v.k==='tl') renderTl(el,v); else if(v.k==='nt') renderNt(el,v); else if(v.k==='ol') renderOl(el,v); else if(v.k==='rm'||v.k==='ft') renderCv(el,v); else renderScene(el,v);
  el.scrollTop=reset?0:keep;
}

function onType(id,ed){

/* ---------- main: entity page ---------- */
function mentionsOf(e){
  const re=makeRe([e.name].concat(e.aliases||[])); const out=[]; if(!re) return out;
  orderedScenes().forEach(o=>{
    const text=S.sc[o.id].text; re.lastIndex=0; let m,n=0,first=null;
    while((m=re.exec(text))){ n++; if(!first) first={i:m.index,l:m[0].length}; if(!m[0].length) re.lastIndex++; }
    if(n) out.push({id:o.id,ch:o.ch,n,first,text});
  });
  return out;
}
const ag=el=>{ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; };
function tlMentionsHtml(e){
  const re=makeRe([e.name].concat(e.aliases||[])), out=[]; if(!re) return '';
  S.meta.tls.forEach(x=>{ const t=S.tl[x.id]; Object.values(t.cards).sort((p,q)=>p.at-q.at).forEach(c=>{ re.lastIndex=0; if(re.test(c.title+'\n'+c.body)) out.push({x,t,c}); }); });
  if(!out.length) return '';
  return '<section class="appears"><h3>On timelines</h3><p class="sub">'+out.length+' card'+(out.length===1?'':'s')+' mention this name.</p>'
    +out.map(o=>'<button class="ap" data-tl="'+o.x.id+'" data-card="'+o.c.id+'"><b><span>'+esc((o.c.icon?o.c.icon+' ':'')+(o.c.title||'Untitled card'))+'</span><span class="mono muted">'+esc(tlWhen(o.t,o.c))+'</span></b><span class="muted" style="font-size:12px">'+esc(o.x.name)+'</span>'+(o.c.body?'<span class="sn">'+esc(o.c.body.slice(0,160))+(o.c.body.length>160?'…':'')+'</span>':'')+'</button>').join('')+'</section>';
}

function renderCork(el){

const normView=(v,d)=>{ v=v||{}; return {x:num(v.x,d.x),y:num(v.y,d.y),k:clamp(num(v.k,1),.2,3)}; };
function normRm(m,ents){

function normFt(f,ents){

/* canvas: pan, zoom, fit */
const cvDoc=()=>S[ui.view.k][ui.view.id];
const cvKey=()=>ui.view.k+'_'+ui.view.id;
function cvApply(){

}
function cvWorld(e){ const r=$('#cv').getBoundingClientRect(), v=cvDoc().view; return {x:(e.clientX-r.left-v.x)/v.k,y:(e.clientY-r.top-v.y)/v.k}; }
function cvZoom(f,cx,cy){
  const v=cvDoc().view, r=$('#cv').getBoundingClientRect(); if(cx==null){ cx=r.width/2; cy=r.height/2; }
  const k=clamp(v.k*f,.2,3); v.x=cx-(cx-v.x)*k/v.k; v.y=cy-(cy-v.y)*k/v.k; v.k=k; cvApply(); dirty(cvKey());

function cvFit(){

  v.k=k; v.x=(r.width-b.width*k)/2-b.x*k; v.y=(r.height-b.height*k)/2-b.y*k; cvApply(); dirty(cvKey());
}
function cvDraw(){ if(ui.view.k==='rm') drawRm(); else if(ui.view.k==='ft') drawFt(); cvApply(); }
function cvRefresh(){ cvDraw(); cvSide(); cvBar(); }
function cvSelect(k,id,focus){
  ui.cvSel=k?{k,id}:null; ui.confirm=null; ui.cvPop=false; cvRefresh();
  const el=k&&$('#cvRoot [data-'+({node:'node',person:'p',union:'u',edge:'edge'}[k]||'x')+'="'+id+'"]'), svg=$('#cv');
  if(el&&svg){   // the side panel narrows the canvas: keep what was just selected in view
    const r=svg.getBoundingClientRect(), b=el.getBoundingClientRect(), v=cvDoc().view, m=24; let dx=0, dy=0;
    if(b.right>r.right-m) dx=r.right-m-b.right; else if(b.left<r.left+m) dx=r.left+m-b.left;
    if(b.bottom>r.bottom-m) dy=r.bottom-m-b.bottom; else if(b.top<r.top+m) dy=r.top+m-b.top;
    if(dx||dy){ v.x+=dx; v.y+=dy; cvApply(); dirty(cvKey()); }
  }
  if(focus){ const i=$('#cvSide [data-f="'+focus+'"]'); if(i){ i.focus(); if(i.select) i.select(); } }
}

/* relationship map drawing */
function drawRm(){
  const m=cvDoc(), g=$('#cvRoot'); if(!g) return;
  const R=n=>RM_R[n.size||m.size], by={}, K={}, sel=ui.cvSel||{};
  m.nodes.forEach(n=>{ by[n.id]=n; }); m.kinds.forEach(k=>{ K[k.id]=k; });
  const near=new Set(); if(sel.k==='node'){ near.add(sel.id); m.edges.forEach(e=>{ if(e.a===sel.id) near.add(e.b); if(e.b===sel.id) near.add(e.a); }); }
  const pairs={}; m.edges.forEach(e=>{ if(K[e.kind].hide) return; const key=[e.a,e.b].sort().join('|'); (pairs[key]=pairs[key]||[]).push(e.id); });
  const end=(N,tx,ty,r)=>{ const d=Math.hypot(tx-N.x,ty-N.y)||1; return {x:N.x+(tx-N.x)/d*r,y:N.y+(ty-N.y)/d*r}; };
  const head=(P,cx,cy)=>{ const a=Math.atan2(P.y-cy,P.x-cx), L=11; return '<path class="ar" d="M'+P.x+' '+P.y+'L'+(P.x-L*Math.cos(a-.42))+' '+(P.y-L*Math.sin(a-.42))+'L'+(P.x-L*Math.cos(a+.42))+' '+(P.y-L*Math.sin(a+.42))+'Z"/>'; };
  let lines='', labels='', nodes='';
  m.edges.forEach(e=>{
    const A=by[e.a], B=by[e.b], k=K[e.kind]; if(!A||!B||k.hide) return;
    const key=[e.a,e.b].sort().join('|'), list=pairs[key], i=list.indexOf(e.id), first=e.a<e.b?A:B, second=e.a<e.b?B:A;
    const dx=second.x-first.x, dy=second.y-first.y, L=Math.hypot(dx,dy)||1, off=(i-(list.length-1)/2)*38;
    const cx=(A.x+B.x)/2-dy/L*off*2, cy=(A.y+B.y)/2+dx/L*off*2;
    const sa=end(A,cx,cy,R(A)+3+(e.dir==='ba'||e.dir==='both'?2:0)), sb=end(B,cx,cy,R(B)+3+(e.dir==='ab'||e.dir==='both'?2:0));
    const d='M'+sa.x.toFixed(1)+' '+sa.y.toFixed(1)+'Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+sb.x.toFixed(1)+' '+sb.y.toFixed(1);
    const on=sel.k==='edge'&&sel.id===e.id, dim=sel.k==='node'&&e.a!==sel.id&&e.b!==sel.id;
    lines+='<g class="rm-e'+(on?' sel':'')+(dim?' dim':'')+'" data-edge="'+e.id+'" style="--c:'+cssCol(k.color)+'"><path class="hit" d="'+d+'"/><path class="ln" d="'+d+'"'+(DASH[k.dash]?' stroke-dasharray="'+DASH[k.dash]+'"':'')+'/>'
      +(e.dir==='ab'||e.dir==='both'?head(sb,cx,cy):'')+(e.dir==='ba'||e.dir==='both'?head(sa,cx,cy):'')+'</g>';
    if(m.labels&&e.label){ const mx=(sa.x+2*cx+sb.x)/4, my=(sa.y+2*cy+sb.y)/4, t=trunc(e.label,34), w=t.length*6.3+14;
      labels+='<g class="rm-lb'+(dim?' dim':'')+'" data-edge="'+e.id+'" style="--c:'+cssCol(k.color)+'" transform="translate('+mx.toFixed(1)+' '+my.toFixed(1)+')"><rect x="'+(-w/2)+'" y="-10" width="'+w+'" height="20" rx="10"/><text dy="4">'+esc(t)+'</text></g>'; }
  });
  m.nodes.forEach(n=>{
    const r=R(n), name=rmName(n), src=m.pics&&n.ent?picSrc(n.ent):'', on=sel.k==='node'&&sel.id===n.id, dim=sel.k==='node'&&!near.has(n.id);
    nodes+='<g class="rm-n'+(on?' sel':'')+(dim?' dim':'')+'" data-node="'+n.id+'" transform="translate('+n.x+' '+n.y+')" style="--c:'+rmCol(n)+'"><circle class="ring" r="'+(r+6)+'"/><circle class="bg" r="'+r+'"/>'
      +(src?'<clipPath id="cp_'+n.id+'"><circle r="'+(r-2.5)+'"/></clipPath><image href="'+esc(src)+'" x="'+(2.5-r)+'" y="'+(2.5-r)+'" width="'+(2*r-5)+'" height="'+(2*r-5)+'" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp_'+n.id+')"/>'

/* family tree layout and drawing */
function ftLayout(f){
  const W=f.cardW, H=34+(f.titles?16:0)+(f.dates?16:0), gx=FT_GAP[f.gap][0], gy=FT_GAP[f.gap][1];
  const P={}, U={}, gen={}; f.people.forEach((p,i)=>{ P[p.id]=p; gen[p.id]=0; }); f.unions.forEach(u=>{ U[u.id]=u; });
  const par=p=>{ const u=U[p.of]; return u?[u.a,u.b].filter(x=>P[x]):[]; };
  const kidsOf={}; f.people.forEach(p=>{ if(U[p.of]) (kidsOf[p.of]=kidsOf[p.of]||[]).push(p.id); });
  for(let it=0;it<80;it++){ let ch=false;   // partners and siblings share a generation; parents sit one row above their children
    const lift=(x,g)=>{ if(gen[x]<g&&g<60){ gen[x]=g; ch=true; } };
    Object.keys(kidsOf).forEach(uid2=>{ const ks=kidsOf[uid2], u=U[uid2], top=Math.max(...ks.map(x=>gen[x])); ks.forEach(x=>lift(x,top)); [u.a,u.b].filter(x=>P[x]).forEach(x=>lift(x,top-1)); });
    f.unions.forEach(u=>{ const ps=[u.a,u.b].filter(x=>P[x]), g=Math.max(...ps.map(x=>gen[x])); ps.forEach(x=>{ if(gen[x]<g&&g<60){ gen[x]=g; ch=true; } }); });
    f.people.forEach(p=>{ const ps=par(p); if(!ps.length) return; const g=Math.max(...ps.map(x=>gen[x]))+1; if(gen[p.id]<g&&g<60){ gen[p.id]=g; ch=true; } });
    if(!ch) break; }
  const partners=id=>f.unions.filter(u=>u.b&&(u.a===id||u.b===id)).map(u=>u.a===id?u.b:u.a);
  const pos={}, maxG=Math.max(0,...f.people.map(p=>gen[p.id]));
  for(let g=0;g<=maxG;g++){
    const row=f.people.filter(p=>gen[p.id]===g), inRow=new Set(row.map(p=>p.id)), placed=new Set(), groups=[];
    const pcx=p=>{ const xs=par(p).filter(x=>pos[x]).map(x=>pos[x].x+W/2); return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:null; };
    const prim=row.filter(p=>pcx(p)!=null).sort((a,b)=>pcx(a)-pcx(b)||f.people.indexOf(a)-f.people.indexOf(b));
    const take=(p,grp)=>{ if(placed.has(p.id)) return; placed.add(p.id); grp.items.push(p); partners(p.id).forEach(q=>{ if(inRow.has(q)&&!placed.has(q)&&pcx(P[q])==null) take(P[q],grp); }); };
    prim.forEach(p=>{ if(placed.has(p.id)) return; const key=p.of; let gr=groups.length&&groups[groups.length-1].key===key?groups[groups.length-1]:null; if(!gr){ gr={key,items:[],c:pcx(p)}; groups.push(gr); } take(p,gr); });
    row.forEach(p=>{ if(placed.has(p.id)) return; const gr={key:'solo',items:[],c:null}; groups.push(gr); take(p,gr); });
    let cur=null;
    groups.forEach(gr=>{ const w=gr.items.length*W+(gr.items.length-1)*gx; let x0=gr.c!=null?gr.c-w/2:(cur==null?0:cur+gx*1.8); if(cur!=null) x0=Math.max(x0,cur+gx*1.8);
      gr.items.forEach((p,i)=>{ pos[p.id]={x:x0+i*(W+gx),y:g*(H+gy)}; }); cur=x0+w; });
  }
  ui.ftGen=gen;
  return {pos,W,H,gy};
}
function drawFt(){
  const f=cvDoc(), g=$('#cvRoot'); if(!g) return;
  const L=ftLayout(f), pos=L.pos, W=L.W, H=L.H, K={}, sel=ui.cvSel||{}; f.kinds.forEach(k=>{ K[k.id]=k; });
  let links='', marks='', cards='';
  f.unions.forEach((u,ui2)=>{
    const A=pos[u.a], B=u.b&&pos[u.b], k=K[u.kind], kids=f.people.filter(p=>p.of===u.id&&pos[p.id]); let O;
    if(A&&B){
      const l=A.x<=B.x?A:B, r=A.x<=B.x?B:A, y=l.y+H/2, sameRow=Math.abs(A.y-B.y)<1, adj=sameRow&&r.x-l.x-W<=FT_GAP[f.gap][0]*2.2+1;
      let d; if(adj){ d='M'+(l.x+W)+' '+y+'H'+r.x; O={x:(l.x+W+r.x)/2,y}; }
      else { const x1=l.x+W/2, x2=r.x+W/2, yb=Math.max(l.y,r.y)+H, dip=yb+18+(ui2%3)*6; d='M'+x1+' '+(l.y+H)+'V'+dip+'H'+x2+'V'+(r.y+H); O={x:(x1+x2)/2,y:dip}; }
      const on=sel.k==='union'&&sel.id===u.id;
      links+='<path class="ft-ul" d="'+d+'" style="--c:'+cssCol(k.color)+'"'+(DASH[k.dash]?' stroke-dasharray="'+DASH[k.dash]+'"':'')+'/>';
      marks+='<g class="ft-u'+(on?' sel':'')+'" data-u="'+u.id+'" transform="translate('+O.x+' '+O.y+')" style="--c:'+cssCol(k.color)+'"><title>'+esc(k.name+(u.label?' · '+u.label:''))+'</title><circle r="10"/><text dy="4">'+esc(k.sym||'')+'</text></g>';
      if(u.label) marks+='<text class="ft-ulb" x="'+O.x+'" y="'+(O.y-15)+'">'+esc(trunc(u.label,22))+'</text>';
    } else if(A) O={x:A.x+W/2,y:A.y+H};
    if(!O||!kids.length) return;
    const top=Math.min(...kids.map(p=>pos[p.id].y)), bus=top-L.gy/2+((ui2%3)-1)*5, xs=kids.map(p=>pos[p.id].x+W/2);
    links+='<path class="ft-ln" d="M'+O.x+' '+(O.y+(A&&B?10:0))+'V'+bus+'M'+Math.min(O.x,...xs)+' '+bus+'H'+Math.max(O.x,...xs)+'"/>';
    kids.forEach(p=>{ const P2=pos[p.id]; links+='<path class="ft-ln" d="M'+(P2.x+W/2)+' '+bus+'V'+P2.y+'"'+(PT_DASH[p.ptype]?' stroke-dasharray="'+PT_DASH[p.ptype]+'"':'')+'/>'; });
  });
  f.people.forEach(p=>{
    const P2=pos[p.id]; if(!P2) return; const name=ftName(p), src=f.pics&&p.ent?picSrc(p.ent):'', on=sel.k==='person'&&sel.id===p.id;
    const col=p.color?cssCol(p.color):p.ent&&S.meta.ents[p.ent]?'var(--'+S.meta.ents[p.ent].type+')':'var(--muted)';
    const pr=Math.min(18,(H-14)/2), tx=src?14+pr*2+10:16, chars=Math.max(4,Math.floor((W-tx-10)/7.2));
    const dates=(p.born||p.died)?(p.born||'?')+' – '+(p.died||''):'';
    let y=22; cards+='<g class="ft-p'+(on?' sel':'')+'" data-p="'+p.id+'" transform="translate('+P2.x+' '+P2.y+')" style="--c:'+col+'"><rect class="bx" width="'+W+'" height="'+H+'" rx="10"/><rect class="st" width="5" height="'+(H-16)+'" x="0" y="8" rx="2"/>'

/* family tree editing */
function ftPerson(f,o,after){ const p=Object.assign({id:uid('p_'),ent:'',name:'',title:'',born:'',died:'',color:'',of:'',ptype:'bio',note:''},o||{}); const i=after?f.people.findIndex(q=>q.id===after):-1; if(i>=0) f.people.splice(i+1,0,p); else f.people.push(p); return p; }
function ftUnion(f,a,b){ const u={id:uid('u_'),a,b:b||'',kind:f.kinds[0].id,label:'',note:''}; f.unions.push(u); return u; }
function ftSoloUnion(f,pid){ return f.unions.find(u=>u.a===pid&&!u.b)||ftUnion(f,pid,''); }
function ftTidy(f){
  const live=new Set(f.people.map(p=>p.id));
  f.unions.forEach(u=>{ if(!live.has(u.b)) u.b=''; if(!live.has(u.a)){ u.a=u.b; u.b=''; } });
  const hasKids=id=>f.people.some(p=>p.of===id);
  f.unions=f.unions.filter(u=>u.a&&(u.b||hasKids(u.id)));
  const us=new Set(f.unions.map(u=>u.id)); f.people.forEach(p=>{ if(!us.has(p.of)) p.of=''; });
}
function ftAct(a,b){
  const f=cvDoc(), sel=ui.cvSel||{}, p=sel.k==='person'&&f.people.find(x=>x.id===sel.id), u=sel.k==='union'&&f.unions.find(x=>x.id===sel.id), save=()=>{ dirty(cvKey()); renderBinder(); };
  if(a==='addpar'&&p){
    const pu=f.unions.find(x=>x.id===p.of);
    if(pu&&pu.b){ toast('They already have two parents here. Select a parent to add a partner instead.',{plain:true}); return; }
    if(pu){ const n=ftPerson(f,{name:'New parent'}); pu.b=n.id; save(); return cvSelect('person',n.id,'name'); }
    const x=ftPerson(f,{name:'New parent'}), y=ftPerson(f,{name:'New parent'}), nu=ftUnion(f,x.id,y.id); p.of=nu.id; save(); cvSelect('person',x.id,'name');
  }
  else if(a==='addpart'&&p){ const n=ftPerson(f,{name:'New partner'},p.id); ftUnion(f,p.id,n.id); save(); cvSelect('person',n.id,'name'); }
  else if(a==='addchild'&&p){ const w=($('#cvSide [data-f="childof"]')||{}).value||'', un=w&&f.unions.find(x=>x.id===w)||ftSoloUnion(f,p.id), n=ftPerson(f,{name:'New child',of:un.id}); save(); cvSelect('person',n.id,'name'); }
  else if(a==='uaddchild'&&u){ const n=ftPerson(f,{name:'New child',of:u.id}); save(); cvSelect('person',n.id,'name'); }
  else if(a==='addsib'&&p){ if(!p.of){ const par=ftPerson(f,{name:'New parent'}); p.of=ftUnion(f,par.id,'').id; } const n=ftPerson(f,{name:'New sibling',of:p.of},p.id); save(); cvSelect('person',n.id,'name'); }

    if(j<0||j>=same.length){ toast('They are already at that end of their family.',{plain:true}); return; }
    const ia=f.people.indexOf(p), ib=f.people.indexOf(same[j]); f.people[ia]=same[j]; f.people[ib]=p; save(); cvRefresh();
  }
  else if(a==='delp'&&p) confirmDo('fp'+p.id,()=>{ f.people=f.people.filter(x=>x.id!==p.id); ftTidy(f); save(); cvSelect(null); },cvSide);
  else if(a==='delu'&&u) confirmDo('fu'+u.id,()=>{ f.people.forEach(x=>{ if(x.of===u.id) x.of=''; }); f.unions=f.unions.filter(x=>x.id!==u.id); save(); cvSelect(null); },cvSide);
  else if(a==='ukind'&&u){ u.kind=b.dataset.v; dirty(cvKey()); cvRefresh(); }
  else if(a==='mkent'&&p){ const id=addEntity('char',(p.name||'New character').slice(0,60)); p.ent=id; p.name=''; save(); renderBinder(); cvRefresh(); toast('Made a '+LS('char').toLowerCase()+' page for '+S.meta.ents[id].name+'.',{plain:true}); }

}
function rmAct(a,b){

  const spot=()=>{ const r=$('#cv').getBoundingClientRect(), v=m.view; let x=(r.width/2-v.x)/v.k, y=(r.height/2-v.y)/v.k, t=0; while(t<40&&m.nodes.some(q=>Math.hypot(q.x-x,q.y-y)<80)){ t++; x+=Math.cos(t*2.4)*30*Math.sqrt(t); y+=Math.sin(t*2.4)*30*Math.sqrt(t); } return {x:Math.round(x),y:Math.round(y)}; };
  const addNode=o=>{ const nn=Object.assign({id:uid('b_'),ent:'',name:'',color:'',size:'',note:''},spot(),o); m.nodes.push(nn); return nn; };

  else if(a==='arrange'){ const N=m.nodes.length; if(!N) return; const r=Math.max(150,N*44/Math.PI); m.nodes.forEach((q,i)=>{ q.x=Math.round(Math.cos(i/N*2*Math.PI-Math.PI/2)*r); q.y=Math.round(Math.sin(i/N*2*Math.PI-Math.PI/2)*r); }); dirty(cvKey()); cvDraw(); cvFit(); }

const tlIdx=(t,v)=>Math.floor((v-t.axis.start)/t.axis.step+1e-9);
function tlLabel(t,v,auto){
  const a=t.axis, idx=tlIdx(t,v), names=tlNames(t), L=names.length;

const tlSpan=(t,at,len)=>tlLabel(t,at)+(len?' – '+tlLabel(t,at+len):'');
const tlWhen=(t,c)=>c.when||tlSpan(t,c.at,c.len);

function tlRange(t,vw){
  const a=t.axis; let lo=a.start, hi=a.start+a.step*6;
  Object.values(t.cards).forEach(c=>{ lo=Math.min(lo,c.at); hi=Math.max(hi,c.at+c.len); });
  if(t.showMarks) t.marks.forEach(m=>{ lo=Math.min(lo,m.at); hi=Math.max(hi,m.at+m.len); });
  const from=a.start+Math.floor((lo-a.start)/a.step)*a.step;

  Object.values(t.cards).sort((p,q)=>p.at-q.at||q.len-p.len).forEach(c=>{
    const L=out[c.lane]; if(!L) return;

function tlAction(act,b){

  else if(act==='ccol'||act==='lcol'||act==='mcol') tlColor(t,act,id,b.dataset.c,true);

  else if(act==='addlane'){
    const nid=uid('l_'); t.lanes.push({id:nid,name:'Lane '+(t.lanes.length+1),color:TL_COLORS[t.lanes.length%TL_COLORS.length][0],hide:false});

    else { const lb=$('#tlScroll [data-tl="lanename"][data-id="'+nid+'"]'); if(lb){ lb.scrollIntoView({block:'nearest'}); tlEditLane(lb); } }
  }
  else if(act==='lup'||act==='ldn'){ const i=t.lanes.findIndex(x=>x.id===id), j=i+(act==='lup'?-1:1); if(i<0||j<0||j>=t.lanes.length) return; const x=t.lanes[i]; t.lanes[i]=t.lanes[j]; t.lanes[j]=x; dirty(tlKey()); drawLaneChips(); drawSide(); drawTl(); }
  else if(act==='dellane') confirmDo('ln'+id,()=>{ if(t.lanes.length<2) return; t.lanes=t.lanes.filter(x=>x.id!==id); Object.keys(t.cards).forEach(k=>{ if(t.cards[k].lane===id) delete t.cards[k]; }); dirty(tlKey()); renderBinder(); drawLaneChips(); drawSide(); drawTl(); },side);
  else if(act==='mark'||act==='addmark'){
    let mid=id;
    if(act==='addmark'){ mid=uid('m_'); t.marks.push({id:mid,label:'New marker',at:tlSnap(t,tlCenter(t)),len:0,color:'muted'}); t.showMarks=true; dirty(tlKey()); }

  }
  else if(act==='delmark') confirmDo('mk'+id,()=>{ t.marks=t.marks.filter(x=>x.id!==id); dirty(tlKey()); drawSide(); drawTl(); },side);
  else if(act==='fromsc'){
    const have=new Set(Object.values(t.cards).map(c=>c.scene).filter(Boolean)), lane=(t.lanes.find(l=>!l.hide)||t.lanes[0]).id, cs=Object.values(t.cards);

function tlEditHead(b){

function tlMove(e){
  const t=curTl(), sc=$('#tlScroll'); if(!D) return; if(!t||!sc){ D=null; return; }
  const a=t.axis, r=sc.getBoundingClientRect();
  if(e.clientX>r.right-36) sc.scrollLeft+=14; else if(e.clientX<r.left+lw()+36) sc.scrollLeft-=14;
  if(e.clientY>r.bottom-30) sc.scrollTop+=10; else if(e.clientY<r.top+AXH+30) sc.scrollTop-=10;
  const dx=e.clientX-D.x0+sc.scrollLeft-D.sl, dy=e.clientY-D.y0+sc.scrollTop-D.st;
  if(!D.moved){ if(Math.abs(dx)<4&&Math.abs(dy)<4) return; D.moved=true; D.el.classList.add('drag'); }
  const du=dx/a.px*a.step, lbl=$('.tc-w',D.el);
  if(D.rs){
    D.nlen=Math.max(0,+(tlSnap(t,D.at+D.len+du)-D.at).toFixed(4));
    const sw=D.nlen/a.step*a.px; D.el.style.width=Math.max(t.cardW,sw)+'px';
    let sp=$('.tc-span',D.el); if(!sp){ sp=document.createElement('i'); sp.className='tc-span'; D.el.prepend(sp); }
    sp.style.width=Math.max(4,sw)+'px'; sp.hidden=!D.nlen;
    if(lbl) lbl.textContent=tlWhen(t,{when:D.c.when,at:D.at,len:D.nlen});
  } else {
    D.nat=tlSnap(t,D.at+du);
    let lane=D.lane, best=1e9;
    sc.querySelectorAll('.tl-track').forEach(tr=>{ const b=tr.getBoundingClientRect(), d=e.clientY<b.top?b.top-e.clientY:e.clientY>b.bottom?e.clientY-b.bottom:0; if(d<best){ best=d; lane=tr.dataset.track; } });
    D.nlane=lane;
    sc.querySelectorAll('.tl-lane').forEach(l=>l.classList.toggle('drop',l.dataset.lane===lane&&lane!==D.lane));
    D.el.style.transform='translate('+((D.nat-D.at)/a.step*a.px)+'px,'+dy+'px)';
    if(lbl) lbl.textContent=tlWhen(t,{when:D.c.when,at:D.nat,len:D.len});
  }
}
function tlUp(e){

  const d=D; D=null; if(!d||!d.moved) return;

    const c=d.c;

}

    else if(x.dataset.mf){

      if(k==='label') m.label=x.value; else { if(x.value===''||!isFinite(+x.value)) return; m[k]=k==='len'?Math.max(0,+x.value):+x.value; }

  tv.addEventListener('change',e=>{

}

function slug(s){ return (s||'novel').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'novel'; }
async function saveFile(name,data){
  if(DESK){ try{ const at=await DESK.saveFile(name,data); if(at) toast('Saved to '+at,{plain:true}); }catch(e){ toast('Could not save the file.',{plain:true}); } return; }
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){ await dl.save({filename:name,data}); return; }
  }catch(e){ if(!e||e.code!=='declined') toast('Could not save the file.',{plain:true}); return; }
  // a plain browser: an ordinary download
  const u=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'})), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
}
async function doBackup(){ const imgs=await collectImages(); saveFile(slug(S.meta.title)+'-backup.json',JSON.stringify(Object.assign({app:'inkling',v:1},snapshot(),{imgs}),null,1)); }
const doExport=()=>saveFile(slug(S.meta.title)+'.md',manuscriptMd());
function manuscriptMd(){
  const m=S.meta; let out='# '+m.title+'\n\n'+(m.author?'by '+m.author+'\n\n':'');
  m.chapters.forEach(c=>{ out+='## '+c.title+'\n\n'+c.scenes.map(id=>(S.sc[id].text||'').trim()).filter(Boolean).join('\n\n* * *\n\n')+'\n\n'; });
  return out.trim()+'\n';
}

  const f=$('.pj-dlg [data-pj]',ov); if(f) f.focus();
}
function closeProjects(){ const ov=$('#pj'); if(ov) ov.hidden=true; }
function drawProjects(){
  const ov=$('#pj'), st=ui.pj; if(!ov||!st) return;
  ov.innerHTML='<div class="pj-dlg" role="dialog" aria-modal="true" aria-labelledby="pjH"><header><h2 id="pjH">'+ico('folder',20)+'Your projects</h2>'+(PJ.id?'<button class="ibtn" data-pj="close" aria-label="Close">'+ico('x')+'</button>':'')+'</header>'
    +'<p class="muted pj-sub">Each project is a separate novel with its own story pages, timelines, maps and Inkling. Everything saves on this computer as you write.</p>'
    +'<div class="pj-new"><button class="btn pri" data-pj="blank">'+ico('plus')+'<span>New blank project</span></button><button class="btn" data-pj="sample">New copy of the sample</button><button class="btn" data-pj="import">'+ico('upload')+'<span>Import a backup…</span></button></div>'
    +'<ul class="pj-list">'+(st.list.length?st.list.map(x=>{ const cur=x.id===PJ.id, cf=st.confirm==='del'+x.id;
      return '<li class="pj-row'+(cur?' cur':'')+'"><div class="pj-top"><button class="pj-open" data-pj="open" data-id="'+esc(x.id)+'"><b>'+esc(x.title||'Untitled novel')+'</b><span>'+fmt(x.words)+' words · saved '+esc(ago(x.saved))+(cur?' · <em>open now</em>':'')+'</span></button>'
        +'<span class="pj-acts"><button class="btn sm" data-pj="dup" data-id="'+esc(x.id)+'">'+ico('copy',14)+'<span>Duplicate</span></button><button class="btn sm" data-pj="bk" data-id="'+esc(x.id)+'" aria-expanded="'+(st.bk===x.id)+'">Backups</button>'
        +'<button class="btn sm" data-pj="reveal" data-id="'+esc(x.id)+'">Show folder</button><button class="btn sm danger" data-pj="del" data-id="'+esc(x.id)+'">'+ico('trash',14)+'<span>'+(cf?'Move to trash?':'Delete')+'</span></button></span></div>'
        +(st.bk===x.id?'<div class="pj-bks">'+(st.bks.length?'<p class="fine">Automatic copies, made at most every 10 minutes while you write. Opening one makes a new project, so nothing is overwritten.</p>'+st.bks.map(n=>'<div class="pj-bk"><span class="mono">'+esc(n.replace('.json','').replace(/^(\d{4}-\d\d-\d\d)-(\d\d)-(\d\d)-(\d\d)$/,'$1 $2:$3'))+'</span><button class="btn sm" data-pj="rb" data-id="'+esc(x.id)+'" data-name="'+esc(n)+'">Open as a copy</button></div>').join(''):'<p class="fine">No automatic backups yet. They are made as you write, at most every 10 minutes.</p>')+'</div>':'')+'</li>'; }).join('')
      :'<li class="muted">No projects yet.</li>')+'</ul>'
    +'<footer><span>Projects folder: <code>'+esc(st.dir)+'</code></span><button class="btn sm" data-pj="root">Open folder</button></footer></div>';
}
async function pjAct(a,id,name){
  const st=ui.pj, refresh=async()=>{ st.list=await DESK.list(); drawProjects(); };
  try{
    if(a==='close') closeProjects();
    else if(a==='open'){ if(id!==PJ.id){ await deskFlush(); if(!await deskOpen(id)) return; } closeProjects(); }
    else if(a==='blank'||a==='sample'){ await deskNew(a); closeProjects(); if(a==='blank'){ const t=$('#projTitle'); t.focus(); t.select(); } }
    else if(a==='import') await deskImportPick();
    else if(a==='dup'){ await deskFlush(); await DESK.duplicate(id); await refresh(); toast('Duplicated. The copy is at the top of the list.',{plain:true}); }
    else if(a==='bk'){ st.bk=st.bk===id?null:id; st.bks=st.bk?await DESK.backups(id):[]; drawProjects(); }
    else if(a==='rb'){ await deskFlush(); await DESK.restoreBackup(id,name); st.bk=null; await refresh(); toast('Added the backup as a new project at the top of the list.',{plain:true}); }
    else if(a==='reveal') DESK.reveal(id);
    else if(a==='root') DESK.reveal();
    else if(a==='del'){
      if(st.confirm!=='del'+id){ st.confirm='del'+id; drawProjects(); clearTimeout(ui.pjt); ui.pjt=setTimeout(()=>{ if(st.confirm==='del'+id){ st.confirm=null; drawProjects(); } },3500); return; }
      st.confirm=null; const wasOpen=id===PJ.id; if(wasOpen){ clearTimeout(P.timer); P.dirty.clear(); PJ.id=null; }
      await DESK.trash(id); st.list=await DESK.list();
      if(wasOpen){ if(st.list.length) await deskOpen(st.list[0].id); else await deskNew('blank'); st.list=await DESK.list(); }
      drawProjects(); toast('Moved to your computer’s trash. You can still get it back from there.',{plain:true});
    }
  }catch(e){ toast('Something went wrong: '+((e&&e.message)||e),{plain:true}); }
}

/* ---------- boot ---------- */
function renderAll(){
  $('#projTitle').value=S.meta.title;
  renderBinder(); renderMain(); renderInspector(); updateStats(); syncTab();
}
function init(){
  try{ const f=+localStorage.getItem('inkling:fs'); if(f>=14&&f<=28) ui.fs=f; }catch(e){}
  let local=null;
  if(!DESK) try{ const raw=localStorage.getItem('inkling:project'); if(raw) local=normalize(JSON.parse(raw)); }catch(e){}
  S=local||normalize(sampleProject());
  linker=buildLinker(); ui.view=firstView();
  $('#tabs').innerHTML=[['binder','Binder','book'],['write','Write','pen'],['pet','Inkling','spark']].map(t=>'<button role="tab" data-tab="'+t[0]+'" aria-selected="false">'+ico(t[2],20)+'<span>'+t[1]+'</span></button>').join('');
  $('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-tab]'); if(!b) return; ui.tab=b.dataset.tab; syncTab(); });
  $('#goalChip').addEventListener('click',()=>{ ui.tab='pet'; syncTab(); const i=$('#insp'); if(i) i.scrollTop=0; });
  $('#projTitle').addEventListener('input',e=>{ S.meta.title=e.target.value||'Untitled novel'; dirty('meta'); if(DESK){ document.title=S.meta.title+' – Inkling'; DESK.setTitle(document.title); } });
  bindBinder(); bindMenu();
  $('#main').addEventListener('click',e=>{
    const b=e.target.closest('[data-a="back"]'); if(b) goBack();
    const c=e.target.closest('.cl'); if(c) go({k:'ent',id:c.dataset.ent});
  });
  $('#insp').addEventListener('click',e=>{ const c=e.target.closest('.cl'); if(c) go({k:'ent',id:c.dataset.ent}); });
  document.addEventListener('selectionchange',()=>{
    const ed=$('#ed'), s=getSelection(); if(!ed||!s.rangeCount) return;
    if(ed.contains(s.anchorNode)&&ed.contains(s.focusNode)){ const t=s.toString(); if(t.trim()) ui.sel=t; else if(s.isCollapsed) ui.sel=''; }
  });
  document.addEventListener('click',e=>{
    const path=e.composedPath();   // the menu re-renders on click, so e.target may already be detached
    if(ui.menu&&!path.includes($('#menu'))&&!path.includes($('#menuBtn'))) closeMenu();
    const pop=$('#mkPop'); if(pop&&!pop.hidden&&!e.target.closest('.mk-wrap')) pop.hidden=true;
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const pj=$('#pj'); if(pj&&!pj.hidden){ if(PJ.id) closeProjects(); } else if(ui.menu) closeMenu(); else if((ui.view.k==='rm'||ui.view.k==='ft')&&(ui.cvSel||ui.cvPop)){ ui.cvSel=null; ui.cvPop=false; ui.confirm=null; cvRefresh(); } else if(ui.view.k==='tl'&&ui.tlSide){ ui.tlSide=null; ui.confirm=null; drawSide(); drawTl(); } else if(ui.focus){ ui.focus=false; syncTab(); renderMain(); } } });
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(ui.view&&ui.view.k==='tl') drawTl(); },150); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden&&P.dirty.size) flush(); });
  window.addEventListener('pagehide',()=>{ if(P.dirty.size) mirrorLocal(); });
  setInterval(()=>{ if(!document.hidden&&Date.now()-ui.sayAt>40000) say(line(curMood())); },15000);
  renderAll();
  if(DESK) deskBoot(); else { setStatus('local'); connectDb(!!local); }
}
init();
})();
</script>
