# Runs the automated tests (tests/) on every push and pull request, and before each desktop release.
name: Tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: Check that index.html is built from src/ and the code is formatted (run "npm run format" and commit)
        run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Get EPUBCheck, the validator ebook stores use, so the tests can check exported EPUBs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          curl -sSfL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/epubcheck-5.1.0/epubcheck.jar"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.1.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Install the desktop app's dependencies (Electron)
        run: npm ci
        working-directory: desktop
      - name: Run the tests (desktop ones need a virtual screen)
        run: xvfb-run -a npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
